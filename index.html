<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StarryHook · 星钩垂钓</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #2c3b2a; }
      #game { position: fixed; inset: 0; }
      #game canvas { display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
      #hud {
        position: fixed; inset: 0; pointer-events: none;
        font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #eaf4f6;
      }
      #topbar {
        position: absolute; top: 14px; left: 16px; right: 16px;
        display: flex; align-items: center; gap: 14px;
        text-shadow: 0 1px 3px rgba(0, 0, 0, .55);
        font-size: 18px;
      }
      #topbar b { font-size: 24px; color: #ffd23f; }
      #reset {
        pointer-events: auto; margin-left: auto;
        font: inherit; font-size: 14px; padding: 4px 14px;
        color: #eaf4f6; background: rgba(12, 47, 63, .8);
        border: 1px solid rgba(159, 216, 232, .5); border-radius: 999px; cursor: pointer;
      }
      #reset:hover { background: rgba(23, 80, 107, .9); }
      #hint {
        position: absolute; bottom: 34px; left: 0; right: 0;
        text-align: center; font-size: 20px; letter-spacing: 1px;
        text-shadow: 0 1px 4px rgba(0, 0, 0, .6);
      }
      #hint.urgent { color: #ffd23f; animation: pulse .35s ease-in-out infinite alternate; }
      @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.12); } }
      #seed { position: absolute; bottom: 10px; right: 12px; font-size: 12px; opacity: .55; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud">
      <div id="topbar">
        得分 <b id="score">0</b> · 最高纪录 <b id="best">0</b>
        <button id="reset" type="button">重开</button>
      </div>
      <div id="hint">按住鼠标蓄力,松开抛竿</div>
      <div id="seed"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
