<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StarryHook · 星钩垂钓</title>
    <style>
      * { box-sizing: border-box; }
      /* ── 皮肤主题令牌(票 #48,spec #45「星露谷风格全铺」):CC0 九宫格素材载体 ──
         样张选型见票 #47 评论区;切片契约与素材清单见 public/ui/kenney-rpg/README.md
         (面板/牌类 slice 8、按钮类 slice 12、pressed = 换源)。一处定义、全 DOM 生效
         (#42 纪律延续):面板族 / 顶栏 pill 组 / toast 的素材引用、画布面裸文字、
         焦点态、禁用态只允许引用这里的变量,逐面板不得再写硬编码色值。
         素材件圆角由素材自带,radius 置 0;批一深色令牌退役(清单见票 #47 评论区与
         public/ui/kenney-rpg/README.md),悬停反馈 = border-image-source 换 pressed
         素材(按钮)/ 提亮(行面)。
         border 仍声明实色(--ui-border 系)作素材加载失败的兜底描边。
         (html/body 的 #2c3b2a 是画布信箱底色,与 main.ts 场景底成对,不属 DOM 主题面。) */
      :root {
        /* 素材件:border-image 源(切片号在规则侧注明) */
        --ui-img-panel: url('/ui/kenney-rpg/panel_brown.png');              /* 面板木框 slice 8,不取 fill,内里衬 --ui-surface */
        --ui-img-titlebar: url('/ui/kenney-rpg/panelInset_brown.png');      /* 面板标题木牌 slice 8 fill */
        --ui-img-row: url('/ui/kenney-rpg/panelInset_beige.png');           /* 行 / 条目 / 空区占位面 slice 8 fill */
        --ui-img-row-active: url('/ui/kenney-rpg/panel_beigeLight.png');    /* 当前模式行 = 浅牌面(与 tan 行面拉开层级) slice 8 fill */
        --ui-img-toast: url('/ui/kenney-rpg/panel_beigeLight.png');         /* toast 圆角牌 slice 8 fill */
        --ui-img-button: url('/ui/kenney-rpg/buttonLong_brown.png');        /* 主按钮 / 顶栏 pill slice 12 */
        --ui-img-button-pressed: url('/ui/kenney-rpg/buttonLong_brown_pressed.png');
        --ui-img-button-soft: url('/ui/kenney-rpg/buttonLong_beige.png');   /* 行内小钮 / 牌上关闭钮 slice 12 */
        --ui-img-button-soft-pressed: url('/ui/kenney-rpg/buttonLong_beige_pressed.png');
        /* 纯色件:画布上方裸文本(得分/纪录/徽章/hint/seed,浮在场景上)──
           暖深字在深绿画布上不可读:画布面一律暖米白 + 暖金数字 + 轻投影(#47 样张共同决策) */
        --ui-canvas-text: #f2e7cf;
        --ui-canvas-accent: #ffd77a;
        --ui-canvas-text-shadow: 0 1px 3px rgba(0, 0, 0, .55);
        /* 纯色件:面板内文字与强调 */
        --ui-text: #4a3423;                       /* 面板内暖字(深棕) */
        --ui-text-dim: #7a6647;                   /* 次级 / 锁定 */
        --ui-accent: #8a5a10;                     /* 面板内强调(toast 字/当前项) */
        --ui-surface: #ece3ce;                    /* 面板内里纯色(米纸) */
        /* 纯色件:边框兜底 / 焦点 / 禁用 */
        --ui-border: #886644;
        --ui-border-soft: rgba(136, 102, 68, .6);
        --ui-border-accent: #886644;
        --ui-border-accent-strong: #6d543a;
        --ui-focus: #a5650d;                      /* 焦点环(素材件上仍用 outline) */
        --ui-disabled-opacity: .45;
        /* 阴影(素材件上仍生效) */
        --ui-shadow-panel: 0 8px 18px rgba(30, 20, 10, .45);
        --ui-shadow-pill: 0 2px 5px rgba(30, 20, 10, .35);
        /* 素材件圆角自带;面板内浅底不投影(画布面用 --ui-canvas-text-shadow) */
        --ui-radius-panel: 0px;
        --ui-radius-row: 0px;
        --ui-radius-pill: 0px;
        --ui-text-shadow: none;
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #2c3b2a; }
      #game { position: fixed; inset: 0; overflow: hidden; }
      /* 画布由 viewport.ts 写入绝对定位 + 整数倍宽高(信箱);这里只管像素级采样 */
      #game canvas {
        display: block; touch-action: none; user-select: none; -webkit-user-select: none;
        image-rendering: -moz-crisp-edges;
        image-rendering: pixelated;
      }
      #hud {
        position: fixed; inset: 0; pointer-events: none;
        /* 字体(spec #12):Fusion Pixel 12px 比例版,npm 自托管(@fontsource,main.ts 引入其 CSS)。
           全部字号取 12 的整数倍,对齐像素网格;font-synthesis 关掉合成粗斜体,
           位图风字形不糊,强调改由字号/颜色承担 */
        font-family: 'Fusion Pixel 12px Proportional SC', system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        font-synthesis: none;
        color: var(--ui-text);
      }
      /* 顶栏浮在场景上:裸文字走画布面令牌(暖米白 + 轻投影),数字暖金。
         flex-wrap 兜底窄窗:绝对定位 + body overflow hidden,不换行时右侧
         pill(重开/静音)会被裁出画面不可点,放不下即折到下一行 */
      #topbar {
        position: absolute; top: 14px; left: 16px; right: 16px;
        display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
        color: var(--ui-canvas-text);
        text-shadow: var(--ui-canvas-text-shadow);
        font-size: 12px; white-space: nowrap;
      }
      #topbar b { font-size: 24px; font-weight: normal; color: var(--ui-canvas-accent); }
      /* 胶囊按钮公共样式(票 #48 素材化):图鉴入口 / 重开 / 静音 / 各面板关闭共用
         Kenney 木钮(slice 12,边厚压到 8px 保紧凑控件高度);悬停 = 换 pressed 素材,
         焦点态(键盘可达)与禁用态(置灰)由下面的统一规则承载,不逐钮重复 */
      .pill {
        pointer-events: auto;
        font: inherit; font-size: 12px; padding: 2px 10px; white-space: nowrap;
        color: var(--ui-canvas-text); background: transparent;
        border: 8px solid var(--ui-border); border-image-source: var(--ui-img-button);
        border-image-slice: 12; border-radius: var(--ui-radius-pill); cursor: pointer;
        min-height: 28px;
        box-shadow: var(--ui-shadow-pill);
      }
      .pill:hover:enabled { border-image-source: var(--ui-img-button-pressed); }
      /* 焦点态(票 #42 统一):键盘焦点统一金棕描边,不占布局(outline);
         鼠标点按不触发(:focus-visible),与既有「点击后 blur 防误触」口径不冲突 */
      #hud button:focus-visible {
        outline: 2px solid var(--ui-focus); outline-offset: 2px;
      }
      /* 禁用态(票 #42 统一):所有入口/购买/转移钮同一置灰,替代逐选择器重复 */
      #hud button:disabled {
        opacity: var(--ui-disabled-opacity); cursor: not-allowed;
      }
      /* 环境徽章(票 #15):季节 · 昼夜 · 天气,文案由 envBadgeText 派生,内容变化才重写 */
      #env-badge { letter-spacing: 1px; opacity: .95; }
      /* 金币(票 #17 故事 2)与装备饵余量徽章(review 修复):顶栏紧凑小字,不另占行;
         金币取画布面暖金(与得分/倒计时同层),饵余量跟环境徽章同灰度层级,克制不挤 */
      #coins { color: var(--ui-canvas-accent); }
      #bait-badge { opacity: .95; }
      #bait-badge[hidden] { display: none; }
      /* 倒计时(票 #24):限时挑战逐秒「1:23」,暖金与金币/得分同层;无限模式整元素隐藏 */
      #countdown { color: var(--ui-canvas-accent); }
      #countdown[hidden] { display: none; }
      /* 面板族公共壳(票 #42 统一,票 #48 素材化):五面板同一张木框九宫格
         (slice 8,边厚画进 2x = 16px)+ 米纸内里;九宫格边厚吃内容宽,
         面板宽度按 #47 几何清单逐面板重定(商店 276→336,其余同边厚补偿 +60)。
         标题条 = 内嵌木牌(panelInset_brown fill,见 .panel-head),不再通栏负外边距;
         border-image 不吃 border-radius,圆角由素材自带(radius 置 0) */
      #mode-panel, #shop-panel, #backpack-panel, #storage-panel, #collection-panel, #order-panel {
        pointer-events: auto; position: absolute; top: 60px; right: 16px;
        overflow: hidden;
        background: var(--ui-surface);
        border: 16px solid var(--ui-border); border-image-source: var(--ui-img-panel);
        border-image-slice: 8; border-radius: var(--ui-radius-panel);
        box-shadow: var(--ui-shadow-panel);
        padding: 12px 14px; font-size: 12px;
      }
      /* 标题条:内嵌木牌(fill 件,面板 padding 内),负外边距通栏色带随 #48 退役 */
      .panel-head {
        display: flex; align-items: center; gap: 10px;
        margin: 0 0 6px; padding: 6px 10px;
        color: var(--ui-canvas-text);
        border: 12px solid var(--ui-border); border-image-source: var(--ui-img-titlebar);
        border-image-slice: 8 fill; border-radius: var(--ui-radius-panel);
      }
      .panel-head b { color: var(--ui-canvas-accent); }
      .panel-title { font-size: 12px; }
      /* 行 / 条目 / 空区占位公共面(票 #48):panelInset_beige 平入九宫格
         (slice 8 fill,边厚 7px + 3px 内边距,#47 样张实测);悬停无平色面,
         交互行靠轻提亮区分(见 .mode-item / button.storage-move) */
      .shop-item, .mode-item, .fish-item, button.storage-move,
      #shop-catch-empty, #backpack-catch-empty, #backpack-collectible-empty, .storage-empty {
        padding: 3px 7px;
        background: transparent;
        border: 7px solid var(--ui-border-soft); border-image-source: var(--ui-img-row);
        border-image-slice: 8 fill; border-radius: var(--ui-radius-row);
      }
      /* 模式面板(票 #24):与既有面板同族样式,面板经 PanelExclusion 互斥打开;
         单局最高纪录(限时单局纪录)常驻面板尾(单局口径,跨会话持久,见 core/timedBest.ts) */
      #mode-panel { width: 304px; }
      #mode-panel[hidden] { display: none; }
      #mode-list { margin: 10px 0 0; display: grid; gap: 6px; }
      .mode-item {
        display: flex; align-items: center; gap: 10px; width: 100%;
        font: inherit; text-align: left;
        color: var(--ui-text); cursor: pointer;
      }
      .mode-item:hover:enabled { filter: brightness(1.06); }
      .mode-item .mode-hint { margin-left: auto; opacity: .9; }
      /* 当前模式 = 抬起框(panel_beige fill)与平入行面区分 */
      .mode-item.current { border-image-source: var(--ui-img-row-active); }
      .mode-item .mode-current { color: var(--ui-accent); }
      #mode-best { margin-top: 10px; opacity: .9; }
      /* 商店面板(票 #20;票 #36 起入口 = 世界摊位交互):与图鉴/模式面板同族样式,
         经 PanelExclusion 互斥打开;金币余额常驻面板头,行内提示承载购买反馈(不用 alert);
         宽度 276→336(#47 几何清单:九宫格边厚 32px 吃内容宽,276px 折行是实测风险) */
      #shop-panel { width: 336px; }
      #shop-panel[hidden] { display: none; }
      #shop-coins { font-size: 24px; font-weight: normal; color: var(--ui-canvas-accent); }
      #shop-list { margin: 10px 0 0; display: grid; gap: 6px; }
      .shop-item {
        display: flex; align-items: center; gap: 10px;
      }
      /* 名称不折行(#47 样张实测措施):行内空间让给详情列,防名称竖排 */
      .shop-item .shop-name { white-space: nowrap; }
      .shop-item .shop-detail { margin-left: auto; opacity: .9; text-align: right; min-width: 84px; }
      /* 行内小钮(#47 样张实测):Kenney 米色木钮,边厚压到 5px 保住紧凑控件高度,
         nowrap 防标签折行;悬停换 pressed 素材 */
      .shop-item .shop-buy {
        padding: 0 4px; min-height: 20px; white-space: nowrap;
        color: var(--ui-text); background: transparent;
        border-width: 5px; border-image-source: var(--ui-img-button-soft);
      }
      .shop-item .shop-buy:hover:enabled { border-image-source: var(--ui-img-button-soft-pressed); }
      /* 金币不足置灰:购买钮禁用即压暗(统一禁用态规则承载),价格与竿名保持可读 */
      #shop-feedback { margin-top: 8px; opacity: .95; }
      #shop-feedback[hidden] { display: none; }
      /* 渔获区块(票 #39,spec §4.3):余额下方常驻收购位,行与卖出钮沿用
         .shop-item/.shop-buy 同族;空包占位与行同族面,靠降不透明度区分层级 */
      #shop-catch { margin-top: 10px; }
      .shop-section-title { opacity: .9; }
      #shop-catch-list { margin-top: 6px; display: grid; gap: 6px; }
      /* 空区占位(商店渔获 / 背包两区 / 储物箱两栏)统一走行面九宫格 + 降不透明度层级;
         外边距按容器分:商店/背包是块级流需补 6px,储物箱在 gap 网格内不另加 */
      #shop-catch-empty, #backpack-catch-empty, #backpack-collectible-empty { margin-top: 6px; }
      #shop-catch-empty[hidden] { display: none; }
      /* 背包面板(票 #40,spec §4.4):渔获区 + 收藏品区,行样式沿用 .shop-item
         同族;两区常驻、空区占位降不透明度;max-height 滚动区随面板加宽重验(#48) */
      #backpack-panel {
        width: 336px;
        max-height: calc(100vh - 76px); overflow-y: auto;
      }
      #backpack-panel[hidden] { display: none; }
      #backpack-catch, #backpack-collectibles { margin-top: 10px; }
      #backpack-catch-list, #backpack-collectible-list { margin-top: 6px; display: grid; gap: 6px; }
      #backpack-catch-empty[hidden], #backpack-collectible-empty[hidden] { display: none; }
      /* 储物箱面板(票 #40,spec §4.4):两栏转移(左背包/右储物箱),行 = 整行按钮,
         点按整堆转移;列头与空栏占位同背包面板层级;max-height 滚动区同上重验(#48) */
      #storage-panel {
        width: 480px;
        max-width: calc(100vw - 32px); max-height: calc(100vh - 76px); overflow-y: auto;
      }
      #storage-panel[hidden] { display: none; }
      #storage-columns { margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .storage-col { display: grid; gap: 6px; align-content: start; }
      #storage-backpack-list, #storage-box-list { display: grid; gap: 6px; }
      .storage-empty[hidden] { display: none; }
      /* 转移行:整行按钮继承行面九宫格,补齐按钮重置;悬停轻提亮(行面无 pressed 件) */
      button.storage-move {
        width: 100%; cursor: pointer;
        font: inherit; color: inherit; text-align: left;
      }
      button.storage-move:hover:enabled { filter: brightness(1.06); }
      #storage-hint { margin-top: 10px; opacity: .7; }
      /* 图鉴面板(票 #53 扩容 18 行):加 max-height 滚动壳,行序超出视口可滚
         (与背包/储物箱同款;面板公共壳的 overflow:hidden 由此逐面板放行) */
      #collection-panel {
        width: 352px;
        max-height: calc(100vh - 76px); overflow-y: auto;
      }
      #collection-panel[hidden] { display: none; }
      /* 公告板面板(票 #55,spec 内容扩充「公告板与订单」):河谷公告板交互点 E 开,
         木框小面板(壳同族);当前订单一行(鱼种 × 品质门槛 × 数量 + 酬金与持有进度)
         + 交付钮,交付成功面板内直接显示新单(队列制同时仅一单);
         行样式沿用 .shop-item 同族,行内拒绝文案承载交付反馈(不用 alert) */
      #order-panel { width: 304px; }
      #order-panel[hidden] { display: none; }
      #order-current { margin-top: 10px; }
      #order-body { margin-top: 6px; display: grid; gap: 6px; }
      /* 订单行两行布局:名称 + 交付钮同行(名称不折行),数量/酬金/持有整行落第二行
         (单行放不下鱼名×门槛 + 详情 + 钮,折行竖排是 #47 实测过的风险) */
      #order-body .order-item { flex-wrap: wrap; }
      #order-body .order-item .shop-detail {
        flex: 1 1 100%; margin-left: 0; min-width: 0; text-align: left; opacity: .9;
      }
      #order-feedback { margin-top: 8px; opacity: .95; }
      #order-feedback[hidden] { display: none; }
      #collection-progress { font-size: 24px; font-weight: normal; color: var(--ui-canvas-accent); }
      #collection-close { margin-left: auto; }
      #collection-list { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
      .fish-item {
        display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px;
      }
      .fish-item .fish-detail { margin-left: auto; font-size: 12px; opacity: .9; }
      /* 出没条件次行(票 #16):文案由 ui/collectionPanelHabitat.ts 依亲和字段派生,
         建行时一次写入;占满整行落到名称/详情下方;保持 12px 像素字体网格,靠降不透明度区分层级 */
      .fish-item .fish-habitat { flex: 1 1 100%; font-size: 12px; opacity: .7; }
      .fish-item.locked { opacity: .45; color: var(--ui-text-dim); }
      .fish-item.locked .fish-detail { font-size: 12px; }
      /* 条目鱼精灵(票 #11,票 #53 扩容):fish-atlas.png 作 CSS sprite,2x 放大 + pixelated;
         2 帧游动动画与小游戏同周期(0.2s/帧);background-position-y 由
         collectionPanel.ts 消费 fishAtlas.ts 的 fishSpriteOffsetY 逐条写入(行 = 鱼种)。
         本组尺寸 32px、背景尺寸 64×576、帧位移 -32px 均为「16px 基线 × 2x」的
         CSS 侧同值,倍率单源见 collectionPanel.ts 的 SPRITE_SCALE(注释互指) */
      .fish-sprite {
        flex: none; align-self: center;
        width: 32px; height: 32px;
        background-image: url('/sprites/fish-atlas.png');
        background-size: 64px 576px; /* 32×288 图集(18 种鱼)按 2x 缩放 */
        background-repeat: no-repeat;
        image-rendering: pixelated;
        animation: fish-swim .4s linear infinite;
      }
      /* 未捕获剪影:亮度归零后统一反向提亮成固定灰,不泄名称与配色细节;停帧 */
      .fish-item.locked .fish-sprite {
        animation: none;
        filter: brightness(0) invert(.55);
      }
      @keyframes fish-swim { 0%, 49.99% { background-position-x: 0; } 50%, 100% { background-position-x: -32px; } }
      #toast-layer {
        position: absolute; top: 62px; left: 0; right: 0;
        display: flex; flex-direction: column; align-items: center; gap: 8px;
        pointer-events: none;
      }
      /* toast(票 #48 素材化):胶囊形制让位 Kenney 圆角牌
         (panel_beigeLight fill,slice 8,边厚 14px);字色 = 面板内强调(深金棕) */
      .toast {
        padding: 2px 12px; font-size: 24px; letter-spacing: 2px;
        color: var(--ui-accent); background: transparent;
        border: 14px solid var(--ui-border); border-image-source: var(--ui-img-toast);
        border-image-slice: 8 fill; border-radius: var(--ui-radius-pill);
        text-shadow: var(--ui-text-shadow);
        box-shadow: var(--ui-shadow-pill);
        /* 动画时序由 toastLayer.ts 依 TOAST_LIFETIME_MS 推导后内联写入,此处只留 keyframes */
      }
      /* 池塘大满贯 toast 样式已随票 #43 退役:集齐改为画布内全屏演出(render/grandSlam) */
      @keyframes toast-in { from { opacity: 0; transform: translateY(-10px) scale(.92); } to { opacity: 1; transform: none; } }
      @keyframes toast-out { to { opacity: 0; transform: translateY(-8px); } }
      #hint {
        position: absolute; bottom: 34px; left: 0; right: 0;
        text-align: center; font-size: 24px; letter-spacing: 1px;
        color: var(--ui-canvas-text);
        text-shadow: var(--ui-canvas-text-shadow);
      }
      #hint.urgent { color: var(--ui-canvas-accent); animation: pulse .35s ease-in-out infinite alternate; }
      @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.12); } }
      #seed { position: absolute; bottom: 10px; right: 12px; font-size: 12px; opacity: .55; color: var(--ui-canvas-text); text-shadow: var(--ui-canvas-text-shadow); }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud">
      <div id="topbar">
        得分 <b id="score">0</b> · 最高纪录 <b id="best">0</b> · <span id="coins"></span><!-- 金币余额(票 #17 故事 2):顶栏随时可见,初始文本由 Hud 依钱包写入,内容变化才重写 -->
        <span id="rod-status"></span><!-- 初始文本由 Hud 依恢复的成长状态写入(老玩家上线即真实等级/竿) -->
        <span id="env-badge"></span><!-- 环境徽章(票 #15):「春 · 日 · 晴」,初始文本由 Hud 依核心环境状态写入;水域不进徽章,换水域面板可见 -->
        <span id="bait-badge" hidden></span><!-- 装备饵余量(review 修复,票 #17 故事 10):「香饵 ×9」,垂钓中商店不可开故常驻顶栏;未装备/耗尽自动隐藏,初始由 Hud 依钱包写入 -->
        <span id="countdown" hidden></span><!-- 顶栏倒计时(票 #24):限时挑战逐秒「1:23」,初始由 Hud 依核心模式状态写入;无限模式整元素隐藏,无残留 -->
        <!-- 商店顶栏入口已随票 #36 退役:开面板的唯一入口 = 世界商店摊位交互点(走近按动作键) -->
        <button id="collection-entry" type="button" class="pill">图鉴</button>
        <!-- 模式入口(票 #24):挂位与重开相邻(顶栏已满,不再新起一段);可用性随阶段变化(仅待机,见 modePanelPolicy),垂钓中置灰 -->
        <button id="mode-entry" type="button" class="pill">模式</button>
        <!-- 背包入口(票 #40,spec §2.4 顶栏保留清单新增):pill 入口、无快捷键;渔获区 + 收藏品区总览 -->
        <button id="backpack-entry" type="button" class="pill">背包</button>
        <button id="reset" type="button" class="pill">重开</button>
        <!-- 静音开关(spec #12):图标即状态,🔊 可听 / 🔇 已静音;持久化见 ui/muteStore.ts -->
        <button id="mute-toggle" type="button" class="pill" aria-label="静音">🔊</button>
      </div>
      <div id="toast-layer"></div>
      <div id="hint">按住鼠标蓄力,松开抛竿</div>
      <div id="seed"></div>
      <div id="collection-panel" hidden>
        <div class="panel-head">
          <span class="panel-title">图鉴</span>
          <b id="collection-progress"></b><!-- 初始文本由 CollectionPanel 依收集册目录长度写入 -->
          <button id="collection-close" type="button" class="pill" aria-label="关闭图鉴">✕ 关闭</button>
        </div>
        <ul id="collection-list"></ul>
      </div>
      <!-- 换水域面板已随票 #36 退役:「去哪钓」由图鉴出没条件承接,水域由钓位走近自动切换 -->
      <div id="shop-panel" hidden>
        <div class="panel-head">
          <span class="panel-title">商店</span>
          <b id="shop-coins"></b><!-- 金币余额(GLOSSARY 金币)常驻面板头,初始文本由 ShopPanel 依钱包写入 -->
          <button id="shop-close" type="button" class="pill" aria-label="关闭商店">✕ 关闭</button>
        </div>
        <!-- 渔获区块(票 #39,spec §4.3 商店摊位兼收购):余额旁常驻,按(鱼种 × 品质)堆叠,
             行内「卖 1 / 全卖」,卖出走 wallet.earn(组合根接线);空包给占位提示 -->
        <div id="shop-catch">
          <div class="shop-section-title">渔获</div>
          <div id="shop-catch-list"></div><!-- 行由 ShopPanel 依背包堆叠生成:目录序 × 品质序,星标缀在鱼名后 -->
          <div id="shop-catch-empty" hidden>背包里还没有渔获</div>
        </div>
        <div id="shop-list"></div><!-- 行由 ShopPanel 依竿表(RODS)与鱼饵表(BAITS)生成:竿三档 + 香饵 + 浓饵(均含购买,饵行含装备切换与「装备中」尾注) -->
        <div id="shop-feedback" hidden></div><!-- 购买/卖出反馈:面板内行内提示,不用 alert -->
      </div>
      <div id="mode-panel" hidden>
        <div class="panel-head">
          <span class="panel-title">模式</span>
          <button id="mode-close" type="button" class="pill" aria-label="关闭模式">✕ 关闭</button>
        </div>
        <div id="mode-list"></div><!-- 行由 ModePanel 生成:无限休闲 / 限时挑战 + 当前模式标识;切换走核心 setMode -->
        <div id="mode-best"></div><!-- 限时单局最高纪录(票 #22/#23 纪录双轨),初始文本由 ModePanel 依 TimedBestStore 写入 -->
      </div>
      <!-- 背包面板(票 #40,spec §4.4):渔获区(鱼种 × 品质堆叠 + 品质星标)+ 收藏品区
           (内容表由票 #41 填充,本票空区占位);鱼饵不进包(余量走钱包/顶栏徽章);
           售卖在商店、存取在储物箱,本面板只读总览 -->
      <div id="backpack-panel" hidden>
        <div class="panel-head">
          <span class="panel-title">背包</span>
          <button id="backpack-close" type="button" class="pill" aria-label="关闭背包">✕ 关闭</button>
        </div>
        <div id="backpack-catch">
          <div class="shop-section-title">渔获</div>
          <div id="backpack-catch-list"></div><!-- 行由 BackpackPanel 依背包渔获堆叠生成:目录序 × 品质序,星标缀在鱼名后 -->
          <div id="backpack-catch-empty" hidden>背包里还没有渔获</div>
        </div>
        <div id="backpack-collectibles">
          <div class="shop-section-title">收藏品</div>
          <div id="backpack-collectible-list"></div><!-- 行由 BackpackPanel 依收藏品堆叠生成(目录序);内容表票 #41 填充 -->
          <div id="backpack-collectible-empty" hidden>还没有收藏品</div>
        </div>
      </div>
      <!-- 储物箱面板(票 #40,spec §4.4):村舍储物箱交互点 E 开;两栏转移(左背包/右储物箱),
           点按整堆转移;渔获与收藏品皆可存、无腐坏、双方无容量上限 -->
      <div id="storage-panel" hidden>
        <div class="panel-head">
          <span class="panel-title">储物箱</span>
          <button id="storage-close" type="button" class="pill" aria-label="关闭储物箱">✕ 关闭</button>
        </div>
        <div id="storage-columns">
          <div class="storage-col">
            <div class="shop-section-title">背包</div>
            <div id="storage-backpack-list"></div><!-- 行由 StoragePanel 依背包堆叠生成,点击存入储物箱 -->
            <div id="storage-backpack-empty" class="storage-empty" hidden>背包是空的</div>
          </div>
          <div class="storage-col">
            <div class="shop-section-title">储物箱</div>
            <div id="storage-box-list"></div><!-- 行由 StoragePanel 依储物箱堆叠生成,点击取回背包 -->
            <div id="storage-box-empty" class="storage-empty" hidden>储物箱是空的</div>
          </div>
        </div>
        <div id="storage-hint">点按物品,整堆转移到对侧</div>
      </div>
      <!-- 公告板面板(票 #55,spec 内容扩充「公告板与订单」):河谷公告板交互点 E 开;
           当前订单(鱼种 × 品质门槛 × 数量)+ 交付,酬金 = 分值 × 数量 × 1.5 入钱包,
           交付成功随即出新单(队列制同时仅一单);缺鱼/品质不足行内分列拒绝 -->
      <div id="order-panel" hidden>
        <div class="panel-head">
          <span class="panel-title">公告板</span>
          <button id="order-close" type="button" class="pill" aria-label="关闭公告板">✕ 关闭</button>
        </div>
        <div id="order-current">
          <div class="shop-section-title">当前委托</div>
          <div id="order-body"></div><!-- 行由 OrderPanel 依公告板当前订单生成:鱼种 × 品质门槛 × 数量 + 酬金与持有进度 + 交付钮 -->
        </div>
        <div id="order-feedback" hidden></div><!-- 交付反馈:面板内行内提示,不用 alert -->
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
